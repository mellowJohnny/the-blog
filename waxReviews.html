<!-- Magic JS to redirect if year is 2004 -->
      <script>
        const params = new URLSearchParams(window.location.search);
        const year = params.get("year");
        const pageName = params.get("pageName");
        const blogCat = params.get("blogCat");
        const isMatch =
          year === "2004" &&
          pageName === "mcd" &&
          blogCat === "mcd";

        if (isMatch) {
          window.location.href = "/lockout.html?year=1991&pageName=mcd&blogCat=mcd";
        }
      </script>

      <!-- Google Core Web Vitals Preload: make the "hero" image visible for each year. Makes GCWV happy -->
       <script>
        // Build the hero image URL using your new naming convention
        if (year) {
          const lcpUrl = `https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/cards/${year}_hero.webp`;

          // Inject a preload tag into <head>
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = lcpUrl;
          preload.fetchPriority = "high";

          document.head.appendChild(preload);
        }
      </script>
