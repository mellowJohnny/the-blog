<!doctype html>

<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <!-- For mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">

    <!-- The review-head markers delimit the block that tools/generateReviewPages
         replaces per set to build reviews/<slug>/index.html. Here it is the
         generic fallback; fetchPageTitle() in wax.js overwrites it per set. -->
    <!-- review-head:start -->
    <title>
      Vintage Hockey Card Set Reviews | Junk Wax Hockey
    </title>

    <meta
      name="description"
      content="Focusing on the Junk Wax Era, in-depth reviews of almost every hockey card set from 1977-78 to 1994-95, including O-Pee-Chee, Upper Deck, Score, Topps, Pinnacle, McDonald's and Tim Hortons. Are any of them still worth collecting? Let's find out!">
    <!-- Generic social preview fallback for crawlers that don't run JavaScript
         (Facebook, Discord, Reddit, X). The canonical/og:url can't be static in
         this file, since it serves every old-style query URL. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vintage Hockey Card Set Reviews | Junk Wax Hockey">
    <meta property="og:description" content="Focusing on the Junk Wax Era, in-depth reviews of almost every hockey card set from 1977-78 to 1994-95, including O-Pee-Chee, Upper Deck, Score, Topps, Pinnacle, McDonald's and Tim Hortons. Are any of them still worth collecting? Let's find out!">
    <meta property="og:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Vintage Hockey Card Set Reviews | Junk Wax Hockey">
    <meta name="twitter:description" content="Focusing on the Junk Wax Era, in-depth reviews of almost every hockey card set from 1977-78 to 1994-95, including O-Pee-Chee, Upper Deck, Score, Topps, Pinnacle, McDonald's and Tim Hortons. Are any of them still worth collecting? Let's find out!">
    <meta name="twitter:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">
    <!-- review-head:end -->
    <link rel="preconnect" href="https://s3.us-east-2.amazonaws.com">
    <link
      rel="preconnect"
      href="https://a92dwyl3ic.execute-api.us-east-2.amazonaws.com"
      crossorigin>

    <!-- Global site tag (gtag.js) - Load Google Analytics until later -->
    <script>
      window.addEventListener('load', function() {
        var g = document.createElement('script');
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-JMGVGK09QX';
        g.async = true;
        document.head.appendChild(g);
      });
    </script>
    <!-- Magic JS to redirect if year is 2004 -->
    <script>
      const paramz = new URLSearchParams(window.location.search);
      const y = paramz.get("year");
      const pn = paramz.get("pageName");
      const bc = paramz.get("blogCat");
      const isMatch =
        y === "2004" &&
        pn === "mcd" &&
        bc === "mcd";

      if (isMatch) {
        window.location.href = "/lockout.html?year=2004&pageName=mcd&blogCat=mcd";
      }
    </script>

    <!-- Fonts are self-hosted (@font-face in styles.css); the masthead uses Bebas Neue -->
    <link rel="preload" href="/fonts/bebas-neue-latin-v16.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Body fonts (latin subset): requested with the HTML instead of after the
         stylesheet arrives, so the text doesn't reflow when they swap in -->
    <link rel="preload" href="/fonts/source-sans-3-latin-v20.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/special-elite-latin-v20.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/nunito-latin-v32.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Set up some global variables visible to all page scripts -->
    <!-- review-params:start -->
    <script>
      const params = new URLSearchParams(window.location.search);
      const year = params.get("year");
      const sortOrder = params.get("sortOrder");
      const pageName = params.get("pageName");
      const blogCat = params.get("blogCat");
      const setID = params.get("setID");
    </script>
    <!-- review-params:end -->

    <!-- Load the stylesheet -->
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <noscript>
      <style>.nhl-ticker { display: none; }</style>
    </noscript>

    <!-- Load the Hella Scripts -->
    <script src="/scripts/wax.js" defer></script>
    <script src="/scripts/ticker.js" defer></script>
    <script src="/scripts/helper.js" defer></script>

    <!-- Wait for the DOM, then run the Intro script and start the set fetch right
         away - not on window load, which also waits on fonts, analytics and the ticker -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderCardIntro(pageName);
        // Set-O-Matic Set Picker: needs only the URL params, so draw it before first
        // paint - on window load it popped in late and pushed the page down
        renderSetPicker(year,resolveBlogCat(blogCat,pageName),pageName);
        //fetchCardSetsByYear() is responsible for calling the underlying AWS web service
        fetchCardSetsByYear(year,sortOrder,resolveBlogCat(blogCat,pageName),setID);
      });
    </script>

    <script>
      // Let's do a bunch of stuff on page load...
      window.addEventListener('load', (event) => {
        // First: fetch Global Nav from helper.js
        fetchNav(pageName);
        fetchFooterLinks();
        // Masthead: random NHL team colors on every load - helper.js
        applyRandomMastheadStyling();
      });

      // Google Analytics
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JMGVGK09QX');
    </script>
  </head>

  <body>
    <section>
      <table class="wax-reviews-mast-table">
        <tr>
          <td>
            <header class="wax-reviews-masthead">
              <a href="/">Junk Wax Hockey</a>
            </header>
          </td>
        </tr>
      </table>
    </section>

    <!-- NHL scores ticker - filled by initNhlTicker() in ticker.js. Visible (empty)
         from first paint so it doesn't pop in; hidden again if there's nothing to show. -->
    <div
      id="nhlTicker"
      class="nhl-ticker"
      role="region"
      aria-label="NHL scores"
      aria-busy="true"
      tabindex="0"
    ></div>

    <nav aria-label="Main">
      <!-- Hamberger menu for mobile in helper.js -->
      <div class="nav-container" id="global-nav-placeholder">
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="global-nav" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>
        <div id="global-nav" class="nav-links"><!-- nav:start --><!-- nav:end --></div>
      </div>
    </nav>
    <main>
      <!-- Filled by renderBreadcrumbs() in helper.js, once the set loads -->
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
      <section>
        <div class="header-style wax-set-name-header">
          <h1 id="pageHeader"></h1>
          <!-- The build writes the set name in here for crawlers that don't run
               JavaScript; hidden on every breakpoint, and removed by wax.js once the
               set loads, since the visible H1 is the set name in the set details. -->
        </div>

        <div class="flex-container">
          <div class="intro" id="card-intro"></div>
        </div>

        <div class="set-o-matic-picker">the set-o-matic year picker</div>

        <div class="flex-container">
          <div id="set-picker"><!-- set-picker:start --><!-- set-picker:end --></div>
          <!-- Drawn by renderSetPicker() in helper.js; a generated page ships it pre-rendered -->
        </div>
      </section>

      <!-- Pagination controls -->
      <section>
        <div class="flex-container">
          <div class="blog-entry" id="cardSetDiv"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <!-- Populated by fetchFooterLinks() in helper.js -->
      <nav id="footer-links" aria-label="Footer"><!-- footer:start --><!-- footer:end --></nav>
      <div id="copy"></div>
      <!-- fetchCopyrightYear() is called from fetchCardSetsByYear() on page load -->
    </footer>

    <!-- Checklist modal: a native dialog, opened with showModal() in wax.js -->
    <dialog
      id="checklistModal"
      class="checklist-modal-content"
      aria-labelledby="checklistModalTitle"
      closedby="any">
        <div class="checklist-modal-controls">
          <button
            type="button"
            class="checklist-modal-print-btn"
            onclick="window.print()"
          >
            🖨 Print
          </button>
          <button
            type="button"
            class="checklist-modal-pdf-btn"
            onclick="exportChecklistPdf()"
          >
            ⬇ Download PDF
          </button>
          <button
            type="button"
            class="checklist-modal-close"
            aria-label="Close"
            onclick="closeChecklistModal()"
          >&times;</button>
        </div>
        <header class="checklist-modal-masthead">
          <a href="/">Junk Wax Hockey.com</a>
        </header>
        <div class="checklist-modal-title-row">
          <h2 id="checklistModalTitle" class="checklist-modal-title"></h2>
          <div class="checklist-modal-filters">
            <label
              class="checklist-modal-filter"
              id="checklistInsertFilterLabel"
              hidden>
              <input
                type="checkbox"
                id="checklistInsertFilter"
                onchange="applyChecklistFilters()">
              Inserts only
            </label>
            <label
              class="checklist-modal-filter"
              id="checklistRookieFilterLabel"
              hidden>
              <input
                type="checkbox"
                id="checklistRookieFilter"
                onchange="applyChecklistFilters()">
              Rookies only
            </label>
          </div>
        </div>
        <div id="checklistModalBody"></div>
        <!-- Print-only -->
        <div
          id="checklistModalPrintFooter"
          class="checklist-modal-print-footer"
        ></div>
    </dialog>
  </body>
</html>
