      <!-- Set up some global variables visible to all page scripts -->
      <script>
        const params = new URLSearchParams(window.location.search);
        const year = params.get("year");
        const sortOrder = params.get("sortOrder");
        const pageName = params.get("pageName");
        const blogCat = params.get("blogCat");
      </script>

      <!-- Google Core Web Vitals Preload: make the "hero" image visible for each year -->
       <script>
        // Build the hero image URL using your new naming convention
        if (year) {
          const lcpUrl = `https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/cards/${year}_hero.webp`;

          // Inject a preload tag into <head>
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = lcpUrl;
          preload.fetchPriority = "high";

          document.head.appendChild(preload);
        }
      </script>

      <!-- Load the stylesheet --> 
      <link rel="preload" href="/styles/styles.css" as="style" onload="this.rel='stylesheet'">
      <noscript><link rel="stylesheet" href="/styles/styles.css"></noscript>

      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <script>
          // Let's do a bunch of stuff on page load...
          window.addEventListener('load', (event) => {
            // First: fetch Global Nav from helper.js
            fetchNav(pageName);
            // Next render the page intro section - in helper.js
            fetchCardIntro(pageName);
            // Call the Set-O-Matic Set Picker
            renderSetPicker(year,blogCat,pageName);

            fetchCardSetsByYear(year,sortOrder,blogCat);
