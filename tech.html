<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en-ca">
  <title>the hella files...a tech blog, Mustang Mach-E blog, vintage and junk wax hockey card set reviews, and an AWS playground</title>
  <head>
    <meta charset="utf-8"> 
    <!-- Load the stylesheet --> 
    <link rel="stylesheet" type="text/css" href="styles/styles.css"> 
    
    <!-- <link rel="preload" href="/styles/styles.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/styles/styles.css"></noscript> -->

   <!-- Load the Google Fontz -->
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap"
        as="style"
        onload="this.rel='stylesheet'">
      <noscript>
        <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap">
      </noscript>

    <!-- Load the Hella Files scripts-->
    <script src="scripts/blogs.js" defer></script> 
    <script src="/scripts/helper.js" defer></script>

    <script>
      let params = new URLSearchParams(document.location.search);
      let blogType = params.get("blogType"); 
      
      window.addEventListener('load', (event) => {
        // *** On page load pass blogType
        fetchBlogs(blogType);

        // *** Fetch copyright year from helper.js
        fetchCopyrightYear();

       // * Fetch the blog into blurb based on blogType
       fetchBlogIntroByType(blogType);

        // *** Fetch the Top Nav from helper.js
        fetchNav("tech",blogType);
        });
    </script>
 </head>

 <body>
  <section>
    <table class="mast-table">
      <tr>
        <td width="80%">
           <header class="masthead"><a href="index.html">the hella files</a></header>
        </td>
        <td> 
          <img class="cms-gif" src="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/20220324-01-06-17avion.gif" />
        </td>

        </tr>
      </table>
  </section>
  <div>
    <nav>
       <!-- Dynamically fetch the Nav using fetchNav() -->
        <div class="nav-container">
            <div class="hamburger" onclick="toggleMenu()">☰</div>
            <div id="global-nav" class="nav-links"></div>
          </div>
    </nav>
  </div>
    <main>
      <section>
        <div class="header-style" id="section-header"></div> <!-- Dynamically fetch the title as part of fetchInto() -->
        <div class="flex-container">
          <div id="blog-intro" class="intro"></div> <!-- Intro is dynamically rendered by the fetchIntro() function in helper.js -->
        </div>
      </section>

       <!-- NEW pagination controls  -->
      <section>
        <div id="blogTop"></div>
        <div class="flex-container">
          <div class="blog-entry" id="blogsDiv"></div>
        </div>
        <div id="paginationControls" style="text-align:center; margin:20px 0;"></div>
      </section> 
    </main>

  <footer class="page-footer">
    <div id="copy"></div> <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
   </footer>
</body>

</html>
