<!doctype html>
<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <!-- Without this, mobile Safari renders at a wide desktop-width
       virtual viewport and just zooms the page out to fit, so the
       @media (max-width: 600px) rules in styles.css never trigger -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">

    <title>
      How This Site Comes Together | Junk Wax Hockey
    </title>

    <meta
      name="description"
      content="About Junk Wax Hockey - who is behind this vintage and junk wax hockey card site, and what you'll find here.">
    <link rel="canonical" href="https://www.junkwaxhockey.com/about.html">
    <!-- Social preview tags - static because Facebook, Discord, Reddit and X don't run JavaScript -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="How This Site Comes Together | Junk Wax Hockey">
    <meta property="og:description" content="About Junk Wax Hockey - who is behind this vintage and junk wax hockey card site, and what you'll find here.">
    <meta property="og:url" content="https://www.junkwaxhockey.com/about.html">
    <meta property="og:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="How This Site Comes Together | Junk Wax Hockey">
    <meta name="twitter:description" content="About Junk Wax Hockey - who is behind this vintage and junk wax hockey card site, and what you'll find here.">
    <meta name="twitter:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">
    <!-- Google Core Web Vitals image preload -->
    <link
      rel="preload"
      as="image"
      href="/images/masthead-v19.webp"
      fetchpriority="high">

    <!-- Stylesheet -->
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- Fonts are self-hosted (@font-face in styles.css); the nav and footer use Nunito -->
    <link rel="preload" href="/fonts/nunito-latin-v32.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Global site tag (gtag.js) - Load Google Analytics until later -->
    <script>
      window.addEventListener('load', function() {
        var g = document.createElement('script');
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-JMGVGK09QX';
        g.async = true;
        document.head.appendChild(g);
      });
    </script>

    <!-- JS -->
    <script src="/scripts/blogs.js" defer></script>
    <script src="/scripts/helper.js" defer></script>

    <script>
      window.addEventListener('load', () => {
        fetchBlogs('98');
        fetchCopyrightYear();
        fetchNav("about");
        fetchFooterLinks();
      });

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JMGVGK09QX');
    </script>
  </head>

  <body>
    <section>
      <header class="home-masthead">
        <img src="/images/masthead-v19.webp" width="1500" height="250" alt="Junk Wax Hockey">
      </header>
    </section>
    <nav aria-label="Main">
      <!-- Dynamically fetch the Nav using fetchNav() in helper.js -->
      <div class="nav-container" id="global-nav-placeholder">
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="global-nav" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>
        <div id="global-nav" class="nav-links" data-nav-page="about"><!-- nav:start --><!-- nav:end --></div>
      </div>
    </nav>
    <main>
      <section>
        <div class="flex-container">
          <!-- Static so the H1 is in the raw HTML for crawlers that don't run JavaScript -->
          <div class="intro" id="blog-intro">
            <h1>How This Site Comes Together</h1>
          </div>
        </div>
      </section>
      <section>
        <div class="flex-container">
          <div class="blog-entry" id="blogsDiv"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <!-- Populated by fetchFooterLinks() in helper.js -->
      <nav id="footer-links" aria-label="Footer"><!-- footer:start --><!-- footer:end --></nav>
      <div id="copy"></div>
      <!-- Populated by fetchCopyrightYear() in helper.js -->
    </footer>
  </body>
</html>
