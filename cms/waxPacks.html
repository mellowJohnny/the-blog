<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - wax pack museum</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap"
      as="style"
      onload="this.rel='stylesheet'">
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap">
    </noscript>

    <script src="/scripts/cmsWaxPack.js"></script>
    <script src="/scripts/helper.js"></script>

    <script>
      window.addEventListener('load', () => {
        fetchCopyrightYear();
        initWaxPacksPage();
      });
    </script>
  </head>

  <body>
    <section>
      <header class="cms-masthead">
        <img src="/images/cms-masthead.webp" width="1500" height="300" alt="cardStack CMS">
      </header>
    </section>

    <section>
      <div>
        <nav>
          <table class="cms-top-nav">
            <tr>
              <td class="cms-nav-td"><a href="/index.html">...exit</a></td>
              <td class="cms-nav-td">
                <a href="/cms/wlcms.html">...back to cms</a>
              </td>
            </tr>
          </table>
        </nav>
      </div>
    </section>

    <div class="header-style">
      <h1>...the wax pack museum</h1>
    </div>

    <main>
      <section>
        <table class="wax-pack-list">
          <thead>
            <tr>
              <th>Year</th>
              <th>Set</th>
              <th>Manufacturer</th>
              <th>Packaging</th>
              <th>Format</th>
              <th>Cards</th>
              <th>Price</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="waxPackRows"></tbody>
        </table>
        <p id="waxPackEmpty" class="error-msg">No wax packs yet.</p>
      </section>

      <section>
        <div class="header-style">
          <h1 id="wpFormTitle">...add a wax pack</h1>
        </div>
        <form id="waxPackForm">
          <table class="cms-form-table">
            <tr>
              <td>
                <label>Year <sup>*</sup></label><br>
                <input type="number" id="wpYear" min="1900" max="2100" required>
              </td>
              <td>
                <label>Set Name <sup>*</sup></label><br>
                <input type="text" id="wpSetName" required>
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <label>Set Slug <sup>*</sup></label>
                <button type="button" class="seo-generate-btn" onclick="generateWaxPackSlug()">Generate</button><br>
                <input type="text" id="wpSetSlug" required>
              </td>
            </tr>
            <tr>
              <td>
                <label>Manufacturer <sup>*</sup></label><br>
                <select id="wpManufacturer" style="width: 200px;"></select>
                <input type="text" id="wpManufacturerNew" style="display: none;">
              </td>
              <td>
                <label>Packaging <sup>*</sup></label><br>
                <select id="wpPackaging" style="width: 200px;"></select>
                <input type="text" id="wpPackagingNew" style="display: none;">
              </td>
            </tr>
            <tr>
              <td>
                <label>Format <sup>*</sup></label><br>
                <select id="wpFormat" style="width: 200px;">
                  <option value="regular">Regular</option>
                  <option value="jumbo">Jumbo</option>
                </select>
              </td>
              <td>
                <label>Cards per Pack <sup>*</sup></label><br>
                <input type="number" id="wpNumCards" min="1" max="200" required>
              </td>
            </tr>
            <tr>
              <td>
                <label>Price <sup>*</sup></label><br>
                <input type="number" id="wpPrice" min="0" max="1000" step="0.01" required>
              </td>
              <td>
                <label>Currency</label><br>
                <select id="wpCurrency" style="width: 200px;">
                  <option value="CAD">CAD</option>
                  <option value="USD">USD</option>
                </select>
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <label>Pack Photo</label><br>
                <input type="text" id="wpImgName" readonly><br>
                <input type="file" id="wpImageFile" accept="image/*">
                <span id="wpImageStatus"></span><br>
                <img id="wpImgPreview" alt="Pack photo preview" style="display: none; max-width: 160px;">
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <label>Notes</label><br>
                <textarea id="wpNotes" class="seo-textarea" rows="2"></textarea>
              </td>
            </tr>
            <tr>
              <td colspan="2" align="left">
                <button type="button" class="input-button" onclick="submitWaxPack()">Save Pack</button>
                <button type="button" class="input-button" id="wpCancelButton" style="display: none;" onclick="resetWaxPackForm()">Cancel</button>
              </td>
            </tr>
          </table>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
