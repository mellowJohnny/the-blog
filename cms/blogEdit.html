<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - blog edit</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- TinyMCE Text Editor Scripts -->
    <script
      src="https://cdn.tiny.cloud/1/mvwlen2v00apovmd9d1sg4q0dltumfdl21z8xr08qqw8dngn/tinymce/8/tinymce.min.js"
      referrerpolicy="origin"
    ></script>

    <!-- CMS JavaScript import  -->
    <script src="/scripts/helper.js"></script>
    <script src="/scripts/cmsBlog.js"></script>
    <script src="/scripts/cmsFormUI.js"></script>

    <script>
      /* Let's get the URL params from the request, and extract the year */
      let params = new URLSearchParams(document.location.search);
      let blogID = params.get("blogID");
      let blogType = params.get("blogType");

      /*
      *   Call to fetchCardSetsByID() on page load, dynamically passing the blogID we want to fetch
      *   It is responsible for calling the underlying AWS web service
      *   Can also use the year to dynamically populate our page header...removed for now   */

      window.addEventListener('load', (event) => {
          fetchBlogByID(blogID);

          // *** Dynamically display the copyright year
          fetchCopyrightYear();
          fetchCmsNav("blogEdit");

          // Load the TinyMCE WYSIWYG Editor from the global config in cmsFormUI.js
          initTinyEditor('#postBody');
      });
    </script>
  </head>

  <body>
    <section>
      <!-- The Home page's banner (Montreal colours, no team pick), with the CMS's name and its own tagline -->
      <table class="wax-reviews-mast-table cms-mast-table masthead-has-tagline">
        <tr>
          <td>
            <header class="wax-reviews-masthead">
              <a href="/cms/wlcms.html">CardStack CMS</a>
            </header>
            <p class="masthead-tagline">Got &rsquo;em...Got &rsquo;em...Need &rsquo;em...</p>
          </td>
        </tr>
      </table>
    </section>
    <div>
      <nav aria-label="Main">
        <div class="nav-container" id="global-nav-placeholder">
          <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="global-nav" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>
          <div id="global-nav" class="nav-links"></div>
        </div>
      </nav>
    </div>
    <section>

      <div class="header-style">
        <h1>...edit a blog post</h1>
      </div>
      <br>

      <main>
        <form>
          <table class="cms-form-table">
            <tr>
              <!-- 1st Row - dropdown -->
              <td colspan="2">
                <label>Publication Status</label><br>
                <!--  Next let's find out if the set's Publication Status -->
                <select id="published" name="published" title="published">
                  <!-- The option tags are dynamically added by the cmsBlog.js populateBlog() function -->
                </select>
              </td>
            </tr>
            <tr>
              <!-- 2nd Row -->
              <td colspan="2">
                <label>Blog Post Title (required)</label><br>
                <input type="text" id="title" required title="blogPostTitle">
              </td>
            </tr>
            <tr>
              <!-- 3rd Row -->
              <td>
                <label>Image Path</label><br>
                <input type="text" id="imgName" title="imgName">
              </td>
              <td>
                <label>Image Caption</label><br>
                <input type="text" id="imgCap" title="imgCap">
              </td>
            </tr>
            <tr>
              <!-- 4th Row -->
              <td>
                <label>Blog Type</label><br>
                <input
                  class="input-text-disabled"
                  type="text"
                  id="blogType"
                  disabled
                  title="blogType">
              </td>
              <td>
                <label>Time</label><br>
                <input
                  class="input-text-disabled"
                  type="text"
                  id="time"
                  disabled
                  title="time">
              </td>
            </tr>
            <tr>
              <!-- 5th Row -->
              <td colspan="2">
                <label>Post Body (required)</label><br><br>
                <textarea id="postBody" required title="postBody"></textarea>
              </td>
            </tr>
            <tr>
              <!-- 6th Row - SUBMIT BUTTON -->
              <td colspan="2">
                <div
                  style="display:flex; justify-content:space-between; align-items:center;"
                >
                  <div>
                    <!-- NOTE: We don't need to grab the postBody becasue the updateBlogPost() in cmsBlog.js gets it from the tinyMCE function  -->
                    <button
                      class="input-button"
                      type="button"
                      id="cmsSubmitButton"
                      onclick="updateBlogPost(
                                      document.getElementById('title').value,
                                      document.getElementById('imgName').value,
                                      document.getElementById('imgCap').value,
                                      document.getElementById('published').value,
                                      document.getElementById('blogType').value,
                                      document.getElementById('time').value,
                                      blogID)"
                    >
                      Update Post
                    </button>
                    <button
                      class="input-button btn-secondary"
                      type="button"
                      onclick="cmsCancelEdit('/cms/pickBlog.html')"
                    >
                      Cancel
                    </button>
                  </div>
                  <button
                    class="input-button delete-btn"
                    type="button"
                    onclick="deleteBlogPost(
                                    blogID,
                                    document.getElementById('blogType').value,
                                    document.getElementById('time').value)"
                  >
                    Delete Post
                  </button>
                </div>
              </td>
            </tr>
          </table>
        </form>
        <!-- This div is rendered if an error occurs... -->
        <div id="errorDiv"></div>
      </main>
    </section>

    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
