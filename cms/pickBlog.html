<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - choosr</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <script src="/scripts/cmsBlog.js"></script>
    <script src="/scripts/helper.js"></script>

    <!--  This calls the getBlogsForUpdate() function on page load.  
              It is responsible for calling the underlying AWS web service -->
    <script>
      window.addEventListener('load', (event) => {
        getBlogsForUpdate();
        // *** Dynamically display the copyright year
        fetchCopyrightYear();
        });
    </script>

    <!--  This calls the getStagedBlogsForUpdate() function on page load.  
              It is responsible for calling the underlying AWS web service -->
    <script>
      window.addEventListener('load', (event) => {
        getStagedBlogsForUpdate();
       });
    </script>
  </head>

  <body>
    <section>
      <!-- The Home page's banner (Montreal colours, no team pick), with the CMS's name and no tagline -->
      <table class="wax-reviews-mast-table cms-mast-table">
        <tr>
          <td>
            <header class="wax-reviews-masthead">
              <a href="/cms/wlcms.html">CardStack CMS</a>
            </header>
          </td>
        </tr>
      </table>
    </section>
    <section>
      <main>
        <div>
          <nav>
            <table class="cms-top-nav">
              <tr>
                <td class="cms-nav-td"><a href="/">...exit</a></td>
                <td class="cms-nav-td">
                  <a href="/cms/wlcms.html">...back to cms</a>
                </td>
              </tr>
            </table>
          </nav>
        </div>
        <table class="cms-set-picker">
          <tr>
            <td>
              <div class="header-style">
                <h1>...edit a live blog</h1>
              </div>
            </td>
            <td>
              <div class="header-style">
                <h1>...edit a staged blog</h1>
              </div>
            </td>
          </tr>
          <tr>
            <td valign="top">
              <div id="listBlogsDiv"></div>
              <div id="noBlogsDiv" class="error-msg"></div>
            </td>
            <td valign="top">
              <div id="listStagedBlogsDiv"></div>
              <div id="noStagedBlogsDiv" class="error-msg"></div>
            </td>
          </tr>
        </table>
      </main>
    </section>
    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
