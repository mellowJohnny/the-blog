<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
<title>cardStack CMS - new</title>
<head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8"> 
    <link rel="icon" type="image/x-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon.ico">
      <link rel="icon" type="image/png" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">
    <link rel="preconnect" href="https://fonts.gstatic.com"> 
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Spicy+Rice&family=Caveat&family=Fira+Code:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.ico">
      <link rel="icon" type="image/png" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
      <link rel="apple-touch-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">

    <!-- TinyMCE -->
    <script src="https://cdn.tiny.cloud/1/eg9hcu6cr4t0wvi6e6uqtb78mj1rycqrixpajuuenn3oaojw/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

    <script>
      window.addEventListener('load', () => {
        fetchCopyrightYear();
        initTinyEditor('#postBody');
      });
    </script>
</head>

<script src="/scripts/cms.js"></script>
<script src="/scripts/wax.js"></script>
<script src="/scripts/helper.js"></script>

<body>
<section>
    <table class="mast-table">
      <tr>
        <td width="80%">
          <div>
           <header class="masthead">card<i>Stack</i></header>
        </td>
        <td class="cms-logo">
          <i>Content</i><br>
          <strong>Management</strong><br>
          <i>System</i><br>
        </td>
      </tr>
    </table>
  </section>

<section>
<div>
    <nav>
      <table class="top-nav">
        <tr>
          <td class="nav-td"><a href="index.html">Home</a></td>
          <td class="nav-td"><a href="/cms/wlcms.html">Back To CMS</a></td>
        </tr>
      </table>
    </nav>
</div>
</section>

<div class="header-style">
    <h1>...add a card set</h1>
    <br><br>
</div>

<section>
<div>
<main>
<form class="form-style">
  <table class="cms-form-table">
    <tr> <!-- First Row - only one form field -->
      <td colspan="2"><label>Status</label><br> 
        <select id="blogStatus" name="blogStatus" title="blogStatus" style="width: 150px;">
          <option value="staged">Staging</option>
          <option value="OK">Live</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <label>Set Category <sup>*</sup></label><br>
          <select id="blogCat" name="blogCat" title="blogCat" style="width: 150px;">
            <option value="reg">Regular</option>
            <option value="tims">Tim Hortons</option>
            <option value="mcd">McDonald's</option>
          </select>
      </td>
    </tr>
    <tr> <!-- 2nd Row - two SEO fields -->
      <td>
        <label>SEO Title</label><br>
        <input type="text" id="seoPageTitle">
      </td>
      <td>
        <label>SEO Meta Description</label><br>
        <input type="text" id="seoMetaDesc">
      </td>
    </tr>
    <tr> <!-- 3rd Row - two SEO fields -->
      <td>
        <label>SEO Friendly URL</label><br>
        <input type="text" id="seoURLSlug">
      </td>
      <td>
        <label>SEO Tags</label><br>
        <input type="text" id="seoTags">
      </td>
    </tr>
    <tr>
      <td>
        <label>Author <sup>*</sup></label><br>
        <div>
          <select id="author" name="author" class="form-style" title="author" style="width: 200px;">
            <option value="Christian Couillard">Christian Couillard</option>
          </select>
        </div>
      </td>
    </tr>
    <tr> <!-- 4th Row -->
      <td colspan="2">
        <label>Set Name</label><br>
        <input type="text" id="setName" required>
      </td>
    </tr>
    <tr> <!-- 5th Row -->
      <td colspan="2">
        <label>Release Year</label><br>
        <input type="text" id="year" required>
      </td>
    </tr>
    <tr> <!-- 6th Row -->
      <td colspan="2">
        <label>Set Size</label><br>
        <input type="text" id="size">
      </td>
    </tr>
    <tr> <!-- 7th Row -->
      <td colspan="2">
        <label>Inserts</label><br>
        <input type="text" id="subsets">                           
      </td>
    </tr>
    <tr> <!-- 8th Row -->
      <td colspan="2">
        <label>Star Rating</label><br>
        <select id="stars" style="width: 150px;">
          <option value="1">One Star</option>
          <option value="2">Two Stars</option>
          <option value="3">Three Stars</option>
          <option value="4">Four Stars</option>
          <option value="5">Five Stars</option>
        </select>
      </td>
    </tr>
    <tr> <!-- 9th Row -->
      <td colspan="2">
        <label>Formats</label><br>
        <input type="text" id="formats">
      </td>
    </tr>
    <tr> <!-- 10th Row -->
      <td colspan="2">
        <label>Manufacturer</label><br>
        <select id="mfg" style="width: 150px;">
          <option value="O-Pee-Chee">O-Pee-Chee</option>
          <option value="Topps">Topps</option>
          <option value="Upper Deck">Upper Deck</option>
          <option value="Score">Score</option>
          <option value="Pro Set">Pro Set</option>
          <option value="Fleer">Fleer</option>
          <option value="Leaf">Leaf</option>
          <option value="Pinnacle">Pinnacle</option>
          <option value="Pacific">Pacific</option>
        </select>
      </td>
    </tr>
    <tr> <!-- 11th Row -->
      <td colspan="2">
        <label>Header Image Name</label><br>
        <input type="text" id="headerImgName"><br>
          <button class="input-button" type="button" onclick="openImageBrowser('headerImgName')">Browse</button>
      </td>
    </tr>
    <tr> <!-- 12th Row -->
      <td colspan="2">
        <label>Footer Image Name</label><br>
        <input type="text" id="footerImgName"><br>
          <button class="input-button" type="button" onclick="openImageBrowser('footerImgName')">Browse</button>
      </td>
    </tr>
    <tr> <!-- 14th Row -->
      <td colspan="2">
        <label>Set Review Text</label><br><br>
        <textarea id="postBody"></textarea>
      </td>
    </tr>
    <tr> <!-- 15th Row - SUBMIT BUTTON -->
      <td colspan="2" align="left">
        <!-- NOTE: We don't need to grab the postBody becasue the updateBlog() gets it from the tinyMCE function  -->
        <button class="input-button" type="button" id="cmsSubmitButton"
          onclick="createCardSet(
            document.getElementById('blogStatus').value,
            document.getElementById('seoPageTitle').value,
            document.getElementById('seoMetaDesc').value,
            document.getElementById('seoURLSlug').value,
            document.getElementById('seoTags').value,
            document.getElementById('author').value,
            document.getElementById('setName').value,
            document.getElementById('size').value,
            document.getElementById('subsets').value,
            document.getElementById('stars').value,
            document.getElementById('formats').value,
            document.getElementById('year').value,
            document.getElementById('headerImgName').value,
            document.getElementById('footerImgName').value,
            document.getElementById('mfg').value,
            document.getElementById('blogCat').value
        )">
        Submit Post
       </button>
</table>
</form>
</main>
</div>
</section>


<footer class="page-footer">
  <div id="copy"></div>
</footer>


<!-- ⭐ ADDED: S3 Image Browser Modal -->
<div id="imageBrowserModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeImageBrowser()">&times;</span>

    <h3>Select an Image</h3>
    <h4>Or Upload A New One</h4>

  <div id="uploadSection" style="margin-bottom: 12px; display: flex; align-items: center; gap: 12px;">
    <!-- Styled Choose File button -->
    <label for="uploadFileInput" style="
      background-color: #256386;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: inline-block;
    ">
      Choose File
    </label>

    <!-- Hidden native input -->
    <input type="file" id="uploadFileInput" accept="image/*" style="display: none;">

    <!-- Filename display -->
    <span id="selectedFileName" style="font-size: 14px; color: #333;">No file chosen</span>

    <!-- Upload button -->
    <button type="button" id="uploadButton" onclick="uploadNewImage()" style="
      background-color: #256386;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    ">
      Upload
    </button>
  </div>
  <div id="uploadStatus" style="font-size: 13px; color: #555;"></div>

  <!-- SEARCH BOX!! -->
  <input type="text" id="imageSearch" placeholder="Search images..." oninput="filterImageList()"
  style="width: 100%; padding: 6px; margin-top: 10px; margin-bottom: 10px; font-size: 14px; box-sizing: border-box;">

  <!-- DYNAMICALLY POPULATE THE MODAL-->
  <div id="imageList"></div>
</div>
</body>
</html>
