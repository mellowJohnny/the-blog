<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - home</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <script src="/scripts/helper.js"></script>
    <script src="/scripts/cmsRinkRunner.js"></script>

    <script>
      window.addEventListener('load', (event) => {
        // *** Dynamically display the copyright year
        fetchCopyrightYear();
        fetchCmsNav("wlcms");
        initRinkRunner("rinkRunnerCanvas");
      });
    </script>
  </head>

  <body>
    <section>
      <!-- The Home page's banner (Montreal colours, no team pick), with the CMS's name and the Home page's tagline -->
      <table class="wax-reviews-mast-table cms-mast-table masthead-has-tagline">
        <tr>
          <td>
            <header class="wax-reviews-masthead">
              <a href="/cms/wlcms.html">CardStack CMS</a>
            </header>
            <p class="masthead-tagline">Got &rsquo;em...Got &rsquo;em...Need &rsquo;em...</p>
          </td>
        </tr>
      </table>
    </section>

    <!-- The CMS home's nav sits under the question, centred -->
    <div class="cms-home-nav">
      <nav aria-label="Main">
        <div class="nav-container" id="global-nav-placeholder">
          <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="global-nav" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>
          <div id="global-nav" class="nav-links"></div>
        </div>
      </nav>
    </div>
    <!-- Rink Runner: the 8-bit hockey runner, drawn by scripts/cmsRinkRunner.js -->
    <section class="rink-runner">
      <canvas id="rinkRunnerCanvas" role="img" aria-label="Rink Runner: an 8-bit hockey player skates across the ice and jumps over pucks, nets, referees, goalies, sticks, popcorn, hot dogs, hat-trick hats, holes in the ice, the team mascot and the Zamboni"></canvas>
      <p class="rink-runner-help">Space, Up arrow or click to jump. Hold it for a higher jump. M turns the music on or off.</p>
      <p class="rink-runner-status" id="rinkRunnerCanvasStatus" aria-live="polite"></p>
    </section>
    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
