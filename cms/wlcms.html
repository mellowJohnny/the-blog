<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - home</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap"
      as="style"
      onload="this.rel='stylesheet'">
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap">
    </noscript>

    <script src="/scripts/helper.js"></script>

    <script>
      window.addEventListener('load', (event) => {
        // *** Dynamically display the copyright year
        fetchCopyrightYear();
        initWlcmsNav();
      });
    </script>
  </head>

  <body>
    <section>
      <header class="cms-masthead">
        <img src="/images/cms-masthead.webp" width="1500" height="300" alt="cardStack CMS">
      </header>
    </section>
    <section></section>
    <br>
    <div class="header-style">
      <h1>...what would you like to do?</h1>
    </div>

    <main>
      <div>
        <nav>
          <ul class="cms-dropdown-nav" id="wlcms-top-nav">
            <li class="cms-nav-item">
              <button
                type="button"
                class="cms-nav-parent"
                aria-haspopup="true"
                aria-expanded="false"
              >
                ...cards
              </button>
              <ul class="cms-nav-dropdown">
                <li><a href="/cms/createCardSet.html">...new card set</a></li>
                <li><a href="/cms/pickCardSet.html">...edit a card set</a></li>
                <li>
                  <a href="/cms/uploadChecklist.html">...manage checklists</a>
                </li>
              </ul>
            </li>
            <li class="cms-nav-item">
              <button
                type="button"
                class="cms-nav-parent"
                aria-haspopup="true"
                aria-expanded="false"
              >
                ...blogs
              </button>
              <ul class="cms-nav-dropdown">
                <li><a href="/cms/createBlogPost.html">...new blog post</a></li>
                <li><a href="/cms/pickBlog.html">...edit a blog post</a></li>
              </ul>
            </li>
            <li class="cms-nav-item">
              <button
                type="button"
                class="cms-nav-parent"
                aria-haspopup="true"
                aria-expanded="false"
              >
                ...admin
              </button>
              <ul class="cms-nav-dropdown">
                <li><a href="/cms/admin.html">...admin tools</a></li>
                <li><a href="/cms/smsAdmin.html">AMP SMS</a></li>
              </ul>
            </li>
            <li class="cms-nav-item cms-nav-item-plain">
              <a href="/index.html">...exit</a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
