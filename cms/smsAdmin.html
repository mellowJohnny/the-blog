<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SMS Message Admin</title>
  
    <link rel="icon" type="image/x-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.ico">
    <link rel="icon" type="image/png" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <link rel="apple-touch-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <meta charset="utf-8"> 

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">
        
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&display=swap">
    </noscript>
    
</head>
    <body>
        <main>
            <!-- Masthead -->
            <section>
                <table class="autobus-mast-table">
                <tr>
                    <td width="100%">
                    <div>
                    <header class="autobus-masthead">
                        <img src="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/cms/white_nameplate_1200x400.png" width="360" height="120"/>
                    </header>
                    </td>
                    <td class="autobus-cms-logo">
                    <i>Autobus</i><br>
                    <strong>Messaging</strong><br>
                    <i>Platform</i><br>
                    </td>
                </tr>
                </table>
            </section>
            <!-- Navigation -->
              <div>
                <nav>
                  <table class="cms-top-nav">
                    <tr>
                      <td class="cms-nav-td"><a href="/cms/wlcms.html">back to cms...</a> </td>
                    </tr>
                  </table>
                </nav>
              </div>
            </section>
            <!-- Form -->
            <section>
                <form class="autobus-form">
                    <label for="message">Message:</label>
                    <textarea id="message" class="autobus-textarea" rows="4"></textarea>
                    <div id="sms-stats" style="margin-top:6px; font-size:14px; color:#555;">
                        Characters: 0<br>
                        Encoding: GSM‑7<br>
                        Segments: 1
                    </div>
                    <button id="sendBtn" class="autobus-send-btn">Send</button>
                </form>


                <br><br>
                <div class="autobus-results">
                    <h2 class="autobus-h2">Results:</h2>
                    <p id="autobus-sent-message-title" class="autobus-sent-message-title" style="display:none;"></p>
                    <p id="autobus-sent-message" class="autobus-sent-message" style="display:none;"></p>

                    <table id="resultsTable" class="autobus-results-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>First Name</th>
                                <th>Phone Number</th>
                                <th>Status</th>
                                <th>Error</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
        
        <!-- Javascript -->
        <script src="/scripts/adminSMS.js"></script>
    </body>
    
</html>
