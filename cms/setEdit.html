<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">


<html lang="en">
    <title>the wee little cms...pick a set to update</title>
    <head>
        <meta charset="utf-8"> 
        <link rel="stylesheet" type="text/css" href="/styles/styles.css">
        <link rel="preconnect" href="https://fonts.gstatic.com"> 
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Spicy+Rice&family=Caveat&family=Fira+Code:wght@300&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200&display=swap" rel="stylesheet">

        <!-- TinyMCE Text Editor Scripts -->
        <script src="https://cdn.tiny.cloud/1/eg9hcu6cr4t0wvi6e6uqtb78mj1rycqrixpajuuenn3oaojw/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
        
        <script src="/scripts/cms.js"></script>

        <script>
            /* Let's get the URL params from the request, and extract the year */  
            let params = new URLSearchParams(document.location.search);
            let setID = params.get("setID");


            /* 
            *   Call to fetchCardSetsByID() on page load, dynamically passing the set year we want to fetch
            *   It is responsible for calling the underlying AWS web service
            *   Can also use the year to dynamically populate our page header...removed for now   
            * */ 
             
            window.addEventListener('load', (event) => {
                fetchCardSetByID(setID);
                // *** Dynamically display the copyright year

                fetchCopyrightYear();

                // Load the TinyMCE WYSIWYG Editor from the global config in cms.js
                initTinyEditor('#postBody');
            }); 
			
        </script>

    </head>

    <body>
        <section>
            <div>
                <header class="masthead">the hella files cms</header>  
                <main>
                  <div>
                    <nav>
                      <table class="top-nav">
                        <tr>
                          <td class="nav-td"><a href="/index.html">Home</a> </td>
                          <td class="nav-td"><a href="/cms/wlcms.html">Back To CMS</a> </td>
                        </tr>
                      </table>
                    </nav>
                  </div>
                  <div class="header-style">
                    <h1>...set edit</h1>
                  </div>
                  <br>
                  <section>
                    <div>
                          <main>
                            <form>
                             <table class="cms-form-table">
                              <tr> <!-- First Row - only one form field -->
                                <td colspan="2"><label>Status</label><br> 
                                  <select id="blogStatus" name="blogStatus" title="blogStatus">
                                    <!-- The option tags are dynamically added by the CMS.js populateCardSet() function -->
                                  </select>
                                </td>
                              </tr>
                              <tr> <!-- 2nd Row - two SEO fields -->
                                <td>
                                  <label>SEO Title</label><br>
                                  <input type="text" id="seoPageTitle">
                                </td>
                                <td>
                                  <label>SEO Meta Description</label><br>
                                  <input type="text" id="seoMetaDesc">
                                </td>
                              </tr>
                              <tr> <!-- 3rd Row - two SEO fields -->
                                <td>
                                  <label>SEO Friendly URL</label><br>
                                  <input type="text" id="seoURLSlug">
                                </td>
                                <td>
                                  <label>SEO Tags</label><br>
                                  <input type="text" id="seoTags">
                                </td>
                              </tr>
                              <tr> <!-- 4th Row -->
                                <td colspan="2">
                                  <label>Set Name</label><br>
                                  <input class="input-text-disabled" type="text" id="setName" title="setName" readonly disabled>
                                </td>
                              </tr>
                              <tr> <!-- 5th Row -->
                                <td colspan="2">
                                  <label>Release Year</label><br>
                                   <input class="input-text-disabled" type="text" id="year" title="year" readonly disabled>
                                </td>
                              </tr>
                              <tr> <!-- 6th Row -->
                                <td colspan="2">
                                  <label>Set Size</label><br>
                                  <input type="text" id="size" title="size">
                                </td>
                              </tr>
                              <tr> <!-- 7th Row -->
                                <td colspan="2">
                                  <label>Inserts</label><br>
                                   <input type="text" id="subsets" title="subsets">
                                </td>
                              </tr>
                              <tr> <!-- 8th Row -->
                                <td colspan="2">
                                  <label>Star Rating</label><br>
                                   <input type="text" id="stars" title="stars">
                                </td>
                              </tr>
                              <tr> <!-- 9th Row -->
                                <td colspan="2">
                                  <label>Formats</label><br>
                                   <input type="text" id="formats" title="formats">
                                </td>
                              </tr>
                              <tr> <!-- 10th Row -->
                                <td colspan="2">
                                  <label>Manufacturer</label><br>
                                  <input type="text" id="mfg" title="mfg">
                                </td>
                              </tr>
                              <tr> <!-- 11th Row -->
                                <td colspan="2">
                                  <label>Header Image Slug</label><br>
                                  <input type="text" id="headerImgName" title="headerImgName">
                                </td>
                              </tr>
                              <tr> <!-- 12th Row -->
                                <td colspan="2">
                                  <label>Footer Image Slug</label><br>
                                  <input type="text" id="footerImgName" title="footerImgName">
                                </td>
                              </tr>
                              <tr> <!-- 13th Row -->
                                <td colspan="2">
                                  <label>Author <sup>*</sup></label><br>
                                      <div>
                                        <select id="author" name="author" title="author" style="width: 200px;">
                                          <option value="Christian Couillard">Christian Couillard</option>
                                        </select>
                                      </div>
                                </td>
                              </tr>
                              <tr> <!-- 14th Row -->
                                <td colspan="2">
                                  <label>Set Review</label><br><br>
                                    <textarea id="postBody" title="postBody"></textarea>
                                </td>
                              </tr>
                              <tr> <!-- 15th Row - SUBMIT BUTTON -->
                                <td colspan="2" align="left">
                                  <!-- NOTE: We don't need to grab the postBody becasue the updateBlog() gets it from the tinyMCE function  -->
                                  <button class="input-button" type="button" id="cmsSubmitButton"
                                      onclick="updateCardSet(
                                              document.getElementById('blogStatus').value,
                                              document.getElementById('seoPageTitle').value,
                                              document.getElementById('seoMetaDesc').value,
                                              document.getElementById('seoURLSlug').value,
                                              document.getElementById('seoTags').value,
                                              document.getElementById('author').value,
                                              document.getElementById('setName').value,
                                              document.getElementById('size').value,
                                              document.getElementById('subsets').value,
                                              document.getElementById('stars').value,
                                              document.getElementById('formats').value,
                                              document.getElementById('year').value,
                                             // document.getElementById('postBody').value,
                                              document.getElementById('headerImgName').value,
                                              document.getElementById('footerImgName').value,
                                              document.getElementById('mfg').value)" >
                                      Update Post
                                  </button>
                                </td>
                              </tr>
                             </table> 
                            </form>
                              </div>
                              <!-- This div is rendered if an error occurs... -->
                              <div id="errorDiv"></div>
                          </main>
                  </section>
                </main>
            </div>
        </section>
        <footer class="page-footer">
          <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
          <div id="copy"></div> 
          
        </footer>
    </body>
</html>
