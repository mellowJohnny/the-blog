<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - set edit</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.ico">
    <link
      rel="icon"
      type="image/png"
      href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <link
      rel="apple-touch-icon"
      href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">
    <link rel="preconnect" href="https://s3.us-east-2.amazonaws.com">
    <link
      rel="preconnect"
      href="https://a92dwyl3ic.execute-api.us-east-2.amazonaws.com">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap"
      as="style"
      onload="this.rel='stylesheet'">
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap">
    </noscript>

    <!-- TinyMCE Text Editor Scripts -->
    <script
      src="https://cdn.tiny.cloud/1/eg9hcu6cr4t0wvi6e6uqtb78mj1rycqrixpajuuenn3oaojw/tinymce/8/tinymce.min.js"
      referrerpolicy="origin"
    ></script>

    <script src="/scripts/cmsCardSet.js"></script>
    <script src="/scripts/cmsImageBrowser.js"></script>
    <script src="/scripts/cmsFormUI.js"></script>
    <script src="/scripts/helper.js"></script>

    <script>
      /* Let's get the URL params from the request, and extract the year */
      let params = new URLSearchParams(document.location.search);
      let setID = params.get("setID");

      /*
      *   Call to fetchCardSetsByID() on page load, dynamically passing the set year we want to fetch
      *   It is responsible for calling the underlying AWS web service
      *   Can also use the year to dynamically populate our page header...removed for now
      * */

      window.addEventListener('load', (event) => {
          fetchCardSetByID(setID);
          // *** Dynamically display the copyright year

          fetchCopyrightYear();

          // Load the TinyMCE WYSIWYG Editor from the global config in cmsFormUI.js
          initTinyEditor('#postBody');
      });
    </script>
  </head>

  <body>
    <section>
      <table class="mast-table">
        <tr>
          <td width="80%">
            <div>
              <header class="masthead">card<i>Stack</i></header>
            </div>
          </td>
          <td class="cms-logo">
            <i>Content</i><br>
            <strong>Management</strong><br>
            <i>System</i><br>
          </td>
        </tr>
      </table>
    </section>
    <section>
      <main>
        <div>
          <nav>
            <table class="cms-top-nav">
              <tr>
                <td class="cms-nav-td"><a href="/index.html">...exit</a></td>
                <td class="cms-nav-td">
                  <a href="/cms/wlcms.html">...back to cms</a>
                </td>
              </tr>
            </table>
          </nav>
        </div>
        <div class="header-style">
          <h1>...set edit</h1>
        </div>
        <br>
        <section>
          <div>
            <main>
              <form>
                <table class="cms-form-table">
                  <tr>
                    <!-- First Row - only one form field -->
                    <td colspan="2">
                      <label>Status</label><br>
                      <select
                        id="blogStatus"
                        name="blogStatus"
                        title="blogStatus"
                        style="width: 200px;"
                      >
                        <!-- The option tags are dynamically added by the cmsCardSet.js populateCardSet() function -->
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <!-- 2nd Row - two SEO fields -->
                    <td>
                      <label>SEO Title</label><br>
                      <input type="text" id="seoPageTitle">
                    </td>
                    <td>
                      <label>SEO Meta Description</label><br>
                      <input type="text" id="seoMetaDesc">
                    </td>
                  </tr>
                  <tr>
                    <!-- 3rd Row - two SEO fields -->
                    <td>
                      <label>SEO Friendly URL</label><br>
                      <input type="text" id="seoURLSlug">
                    </td>
                    <td>
                      <label>SEO Keywords</label><br>
                      <input type="text" id="seoTags">
                    </td>
                  </tr>
                  <tr>
                    <!-- 4th Row -->
                    <td>
                      <label>Author</label><br>
                      <input
                        class="input-text-disabled"
                        type="text"
                        id="author"
                        title="author"
                        readonly
                        disabled>
                    </td>
                    <td>
                      <label>Manufacturer</label><br>
                      <input type="text" id="mfg" title="mfg">
                    </td>
                  </tr>
                  <tr>
                    <!-- 5th Row -->
                    <td>
                      <label>Set Name</label><br>
                      <input
                        class="input-text-disabled"
                        type="text"
                        id="setName"
                        title="setName"
                        readonly
                        disabled>
                    </td>
                    <td>
                      <label>Release Year</label><br>
                      <input
                        class="input-text-disabled"
                        type="text"
                        id="year"
                        title="year"
                        readonly
                        disabled>
                    </td>
                  </tr>
                  <tr>
                    <!-- 6th Row -->
                    <td>
                      <label>Set Size</label><br>
                      <input type="text" id="size" title="size">
                    </td>
                    <td>
                      <label>Inserts</label><br>
                      <input type="text" id="subsets" title="subsets">
                    </td>
                  </tr>
                  <tr>
                    <!-- 7th Row -->
                    <td>
                      <label>Star Rating</label><br>
                      <input type="text" id="stars" title="stars">
                    </td>
                    <td>
                      <label>Formats</label><br>
                      <input type="text" id="formats" title="formats">
                    </td>
                  </tr>
                  <tr>
                    <!-- 9th Row -->
                    <td>
                      <label>Header Image</label><br>
                      <input
                        type="text"
                        id="headerImgName"
                        title="headerImgName"><br>
                      <button
                        class="input-button"
                        type="button"
                        onclick="openImageBrowser('headerImgName')"
                      >
                        Browse
                      </button>
                    </td>
                    <td>
                      <label>Footer Image</label><br>
                      <input
                        type="text"
                        id="footerImgName"
                        title="footerImgName"><br>
                      <button
                        class="input-button"
                        type="button"
                        onclick="openImageBrowser('footerImgName')"
                      >
                        Browse
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <!-- 10th Row -->
                    <td colspan="2">
                      <label>Set Review</label><br><br>
                      <textarea id="postBody" title="postBody"></textarea>
                    </td>
                  </tr>
                  <tr>
                    <!-- 11th Row - SUBMIT BUTTON -->
                    <td colspan="2">
                      <div
                        style="display:grid; grid-template-columns: 1fr auto 1fr; align-items:center;"
                      >
                        <div style="justify-self:start;">
                          <!-- NOTE: We don't need to grab the postBody becasue the updateBlog() gets it from the tinyMCE function  -->
                          <button
                            class="input-button"
                            type="button"
                            id="cmsSubmitButton"
                            onclick="updateCardSet(
                                                  document.getElementById('blogStatus').value,
                                                  document.getElementById('seoPageTitle').value,
                                                  document.getElementById('seoMetaDesc').value,
                                                  document.getElementById('seoURLSlug').value,
                                                  document.getElementById('seoTags').value,
                                                  document.getElementById('author').value,
                                                  document.getElementById('setName').value,
                                                  document.getElementById('size').value,
                                                  document.getElementById('subsets').value,
                                                  document.getElementById('stars').value,
                                                  document.getElementById('formats').value,
                                                  document.getElementById('year').value,
                                                  document.getElementById('headerImgName').value,
                                                  document.getElementById('footerImgName').value,
                                                  document.getElementById('mfg').value)"
                          >
                            Update Post</button
                          >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                          <button
                            class="input-button"
                            type="button"
                            onclick="cmsCancelEdit('/cms/pickCardSet.html')"
                          >
                            Cancel
                          </button>
                        </div>
                        <button
                          class="input-button"
                          type="button"
                          style="justify-self:center;"
                          onclick="openPreview()"
                        >
                          Preview
                        </button>
                        <button
                          class="input-button delete-btn"
                          type="button"
                          style="justify-self:end;"
                          onclick="deleteCardSet(
                                                setID,
                                                document.getElementById('setName').value,
                                                document.getElementById('year').value)"
                        >
                          Delete Set
                        </button>
                      </div>
                    </td>
                  </tr>
                </table>
              </form>
            </main>
          </div>
          <!-- This div is rendered if an error occurs... -->
          <div id="errorDiv"></div>
        </section>
      </main>
    </section>

    <!-- Preview Modal -->
    <div id="previewModal" class="preview-modal">
      <div class="preview-modal-content">
        <span class="close" onclick="closePreview()">&times;</span>
        <div id="previewContainer"></div>
      </div>
    </div>

    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>

    <!-- S3 Image Browser Modal - same markup as createCardSet.html
         (scripts/cmsImageBrowser.js drives both, generically by
         targetFieldId - see openImageBrowser('headerImgName'/
         'footerImgName') above). -->
    <div id="imageBrowserModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeImageBrowser()">&times;</span>

        <h3>Select an Image</h3>
        <h4>Or Upload A New One</h4>

        <div
          style="margin-bottom: 12px; display: flex; align-items: center; gap: 12px;"
        >
          <!-- Styled Choose File button -->
          <label
            for="uploadFileInput"
            style="
      background-color: #256386;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: inline-block;
    "
          >
            Choose File
          </label>

          <!-- Hidden native input -->
          <input
            type="file"
            id="uploadFileInput"
            accept="image/*"
            style="display: none;">

          <!-- Filename display -->
          <span id="selectedFileName" style="font-size: 14px; color: #333;"
            >No file chosen</span
          >

          <!-- Upload button -->
          <button
            type="button"
            onclick="uploadNewImage()"
            style="
      background-color: #256386;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    "
          >
            Upload
          </button>
        </div>
        <div id="uploadStatus" style="font-size: 13px; color: #555;"></div>

        <!-- SEARCH BOX!! -->
        <input
          type="text"
          id="imageSearch"
          placeholder="Search images..."
          oninput="filterImageList()"
          style="width: 100%; padding: 6px; margin-top: 10px; margin-bottom: 10px; font-size: 14px; box-sizing: border-box;">

        <!-- DYNAMICALLY POPULATE THE MODAL-->
        <div id="imageList"></div>
      </div>
    </div>
  </body>
</html>
