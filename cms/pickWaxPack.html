<!doctype html>
<!-- Without this, mobile Safari renders at a wide desktop-width virtual
     viewport and just zooms the page out to fit, so the @media
     (max-width: 600px) rules in styles.css never trigger -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<html lang="en">
  <head>
    <script src="/scripts/auth.js"></script>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>cardStack cms - choose a wax pack</title>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <script src="/scripts/cmsWaxPack.js"></script>
    <script src="/scripts/helper.js"></script>

    <script>
      window.addEventListener('load', () => {
        fetchCopyrightYear();
        initPickWaxPackPage();
      });
    </script>
  </head>

  <body>
    <section>
      <header class="cms-masthead">
        <img src="/images/cms-masthead.webp" width="1500" height="200" alt="cardStack CMS">
      </header>
    </section>
    <section>
      <main>
        <div>
          <nav>
            <table class="cms-top-nav">
              <tr>
                <td class="cms-nav-td"><a href="/index.html">...exit</a></td>
                <td class="cms-nav-td">
                  <a href="/cms/wlcms.html">...back to cms</a>
                </td>
              </tr>
            </table>
          </nav>
        </div>
        <div class="header-style">
          <h1>...edit a wax pack</h1>
        </div>
        <div id="waxPackLinksDiv"></div>
        <div id="noWaxPacksDiv" class="error-msg"></div>
      </main>
    </section>
    <footer class="page-footer">
      <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
      <div id="copy"></div>
    </footer>
  </body>
</html>
