<!doctype html>

<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <!-- Without this, mobile Safari renders at a wide desktop-width
         virtual viewport and just zooms the page out to fit, so the
         @media (max-width: 600px) rules in styles.css never trigger -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/icons/icon-192.png">
    <link
      rel="apple-touch-icon"
      href="/images/icons/apple-touch-icon.png">
    <title>Player Search - find which vintage hockey card sets a player appears in | Junk Wax Hockey</title>

    <meta name="description"
          content="Search by player name to find every vintage and junk wax hockey card set reviewed on Junk Wax Hockey that they appear in, with a direct link to each set's review.">
    <!-- Canonical is always the bare page, ignoring any ?q= - the search tool
         is what's worth indexing, not thin per-query result pages. -->
    <link rel="canonical" href="https://www.junkwaxhockey.com/playerSearch.html">
    <!-- Social preview tags - static because Facebook, Discord, Reddit and X don't run JavaScript -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Player Search - find which vintage hockey card sets a player appears in | Junk Wax Hockey">
    <meta property="og:description" content="Search by player name to find every vintage and junk wax hockey card set reviewed on Junk Wax Hockey that they appear in, with a direct link to each set's review.">
    <meta property="og:url" content="https://www.junkwaxhockey.com/playerSearch.html">
    <meta property="og:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Player Search - find which vintage hockey card sets a player appears in | Junk Wax Hockey">
    <meta name="twitter:description" content="Search by player name to find every vintage and junk wax hockey card set reviewed on Junk Wax Hockey that they appear in, with a direct link to each set's review.">
    <meta name="twitter:image" content="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp">

    <!-- Fonts are self-hosted (@font-face in styles.css); the masthead uses Bebas Neue -->
    <link rel="preload" href="/fonts/bebas-neue-latin-v16.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Load the stylesheet - plain blocking link, deliberately not the
         preload+swap trick (see index.html's comment - that let raw
         unstyled HTML paint before CSS was ready, a visible flash on
         every navigation). -->
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- The nav and footer use Nunito -->
    <link rel="preload" href="/fonts/nunito-latin-v32.woff2" as="font" type="font/woff2" crossorigin>
    <noscript>
      <style>.nhl-ticker { display: none; }</style>
    </noscript>

    <!-- Global site tag (gtag.js) - Load Google Analytics until later -->
    <script>
      window.addEventListener('load', function() {
        var g = document.createElement('script');
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-JMGVGK09QX';
        g.async = true;
        document.head.appendChild(g);
      });
    </script>

    <!-- Load the Hella Files scripts -->
    <script src="scripts/playerSearch.js" defer></script>
    <script src="/scripts/ticker.js" defer></script>
    <script src="/scripts/helper.js" defer></script>

    <script>
      const params = new URLSearchParams(document.location.search);
      const pageName = "playerSearch"; // matches the NAV_MAP key in helper.js, not the "search" NAV_ITEMS id

      window.addEventListener('load', (event) => {
        // *** Fetch copyright year from helper.js
        fetchCopyrightYear();

        // *** Fetch the Top Nav from helper.js
        fetchNav(pageName);
        fetchFooterLinks();

        // Masthead: random NHL team colors on every load - helper.js
        applyRandomMastheadStyling();


        // Type-ahead dropdown - playerSearch.js. Prefetch the player
        // name index immediately (rather than waiting for the first
        // keystroke) so suggestions feel instant once the visitor
        // starts typing.
        initPlayerSearchTypeahead();
        loadPlayerNameIndex();

        // *** If a ?q= is already in the URL (e.g. a shared link), run
        // that search immediately on load.
        const initialQuery = params.get("q");
        if (initialQuery) {
          document.getElementById("playerSearchInput").value = initialQuery;
          runPlayerSearch(initialQuery);
        }
      });

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JMGVGK09QX');
    </script>
 </head>

 <body>
  <section>
    <table class="wax-reviews-mast-table">
      <tr>
        <td>
          <header class="wax-reviews-masthead"><a href="/">Junk Wax Hockey</a></header>
        </td>
      </tr>
    </table>
  </section>
    <!-- NHL scores ticker - filled by initNhlTicker() in ticker.js. Visible (empty)
         from first paint so it doesn't pop in; hidden again if there's nothing to show. -->
    <div
      id="nhlTicker"
      class="nhl-ticker"
      role="region"
      aria-label="NHL scores"
      aria-busy="true"
      tabindex="0"
    ></div>

  <div>
    <nav>
          <!-- Hamberger menu for mobile in helper.js -->
        <div class="nav-container" id="global-nav-placeholder">
          <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="global-nav" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>
          <div id="global-nav" class="nav-links" data-nav-page="playerSearch"><!-- nav:start --><!-- nav:end --></div>
        </div>
      </nav>
  </div>
    <main>
      <section>
        <div class="header-style">
          <h1>Player Search</h1>
        </div>
        <div class="flex-container">
          <div class="intro" id="player-search-intro">
            <p>Wondering which sets your favourite players are in? Search by player name to find out! Not every set from the junk wax era has been reviewed, so there may be gaps. Just like Bobby Clarke's smile.</p>
          </div>
        </div>
      </section>

      <section>
        <div class="flex-container">
          <div id="player-search-form">
            <search>
            <form onsubmit="event.preventDefault(); runPlayerSearch(document.getElementById('playerSearchInput').value);">
              <label for="playerSearchInput">Player name</label><br>
              <div class="player-search-input-wrap">
                <input type="text" id="playerSearchInput" placeholder="e.g. Gretzky" autocomplete="off"
                  role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="playerSearchSuggestions">
                <ul id="playerSearchSuggestions" class="player-search-suggestions" role="listbox" aria-label="Player name suggestions"></ul>
              </div><br>
              <button type="submit" class="input-button">Search</button>
            </form>
            <!-- Screen-reader announcements: suggestion counts and search results (announcePlayerSearch(), playerSearch.js) -->
            <p id="playerSearchStatus" class="player-search-sr" role="status"></p>
            </search>
          </div>
        </div>
      </section>

      <section>
        <div class="flex-container">
          <div id="playerSearchResults" class="player-search-results"></div>
        </div>
      </section>
    </main>

  <footer class="site-footer">
    <!-- Populated by fetchFooterLinks() in helper.js -->
    <nav id="footer-links" aria-label="Footer"><!-- footer:start --><!-- footer:end --></nav>
    <div id="copy"></div>
    <!-- Populated by fetchCopyrightYear() in helper.js -->
  </footer>
</body>

</html>
