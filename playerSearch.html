<!DOCTYPE html>

<html lang="en-ca">
  <head>
  <meta charset="utf-8">
    <!-- Without this, mobile Safari renders at a wide desktop-width
         virtual viewport and just zooms the page out to fit, so the
         @media (max-width: 600px) rules in styles.css never trigger -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.ico">
    <link rel="icon" type="image/png" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <link rel="apple-touch-icon" href="https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/favicon2.png">
    <title>the hella files...Player Search - find which vintage hockey card sets a player appears in</title>

    <meta name="description"
          content="Search by player name to find every vintage and junk wax hockey card set reviewed on the hella files that they appear in, with a direct link to each set's review.">

    <!-- Self-hosted Bebas Neue for the masthead - same treatment as
         waxReviews.html/lockout.html, kept byte-for-byte identical
         (see FRONTEND.md's Typography/fonts section). -->
    <style>
      /* latin-ext */
    @font-face {
      font-family: 'Bebas Neue';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/bebasneue/v16/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
      font-family: 'Bebas Neue';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/bebasneue/v16/JTUSjIg69CK48gW7PXoo9WlhyyTh89Y.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    </style>

    <link rel="preload" href="https://fonts.gstatic.com/s/bebasneue/v16/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.gstatic.com/s/bebasneue/v16/JTUSjIg69CK48gW7PXoo9WlhyyTh89Y.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Load the stylesheet - plain blocking link, deliberately not the
         preload+swap trick (see index.html's comment - that let raw
         unstyled HTML paint before CSS was ready, a visible flash on
         every navigation). -->
    <link rel="stylesheet" type="text/css" href="/styles/styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Nunito:wght@200&family=Special+Elite&family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@200;400;700&family=Fira+Code:wght@300&display=swap">
    </noscript>

    <!-- Load the Hella Files scripts -->
    <script src="scripts/playerSearch.js" defer></script>
    <script src="/scripts/helper.js" defer></script>

    <script>
      const params = new URLSearchParams(document.location.search);
      const pageName = "playerSearch"; // matches the NAV_MAP key in helper.js, not the "search" NAV_ITEMS id

      window.addEventListener('load', (event) => {
        // *** Fetch copyright year from helper.js
        fetchCopyrightYear();

        // *** Fetch the Top Nav from helper.js
        fetchNav(pageName);

        // Canonical always points at the bare page, ignoring any ?q= -
        // the search tool itself is what's worth indexing, not thin
        // per-query result pages.
        setPageMeta({
          title: "the hella files...Player Search - find which vintage hockey card sets a player appears in",
          description: "Search by player name to find every vintage and junk wax hockey card set reviewed on the hella files that they appear in, with a direct link to each set's review.",
          image: "https://s3.us-east-2.amazonaws.com/mellowjohnny.cc.files/img/hellaFilesArch.webp",
          url: "https://www.mellowjohnny.cc/playerSearch.html",
          type: "website"
        });

        // *** If a ?q= is already in the URL (e.g. a shared link), run
        // that search immediately on load.
        const initialQuery = params.get("q");
        if (initialQuery) {
          document.getElementById("playerSearchInput").value = initialQuery;
          runPlayerSearch(initialQuery);
        }
      });
    </script>
 </head>

 <body>
  <section>
    <table class="wax-reviews-mast-table">
      <tr>
        <td>
          <header class="wax-reviews-masthead"><a href="index.html">the hella files</a></header>
        </td>
      </tr>
    </table>
  </section>
  <div>
    <nav>
          <!-- Hamberger menu for mobile in helper.js -->
        <div class="nav-container" id="global-nav-placeholder">
          <div class="hamburger" onclick="toggleMenu()">☰</div>
          <div id="global-nav" class="nav-links"></div>
        </div>
      </nav>
  </div>
    <main>
      <section>
        <div class="header-style">
          <h1>...player search</h1>
        </div>
        <div class="flex-container">
          <div class="intro">
            <p>Wondering which sets a specific player appears in? Search by player name to find out!</p>
            <p>NOTE! Not every set from the junk wax era has been reviewed, so there will be gaps for sets like early ProSet or Bowman</p>
            <p>Just so 'ya know...</p>
          </div>
        </div>
      </section>

      <section>
        <div class="flex-container">
          <div id="player-search-form">
            <form onsubmit="event.preventDefault(); runPlayerSearch(document.getElementById('playerSearchInput').value);">
              <label for="playerSearchInput">Player name</label><br>
              <input type="text" id="playerSearchInput" placeholder="e.g. Gretzky" autocomplete="off"><br>
              <button type="submit" class="input-button">Search</button>
            </form>
          </div>
        </div>
      </section>

      <section>
        <div class="flex-container">
          <div id="playerSearchResults" class="player-search-results"></div>
        </div>
      </section>
    </main>

  <footer class="page-footer">
    <div id="copy"></div> <!-- Insert the page copyright: populated by calling fetchCopyrightYear() on page load -->
   </footer>
</body>

</html>
